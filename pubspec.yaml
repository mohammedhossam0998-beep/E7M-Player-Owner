name: e7m
description: E7gzly Ml3b - Football Pitch Booking Platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.5.0
  cupertino_icons: ^1.0.8

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  uuid: ^4.5.1
  geolocator: ^14.0.1
  table_calendar: ^3.1.2

  image: ^4.3.0
  image_picker: ^1.2.2

  url_launcher: ^6.3.0
  lottie: ^3.1.2
  pin_code_fields: ^8.0.1

  record: ^6.1.1
  audioplayers: ^6.5.0
  permission_handler: ^12.0.2

  go_router: ^16.2.1

  http_parser: ^4.1.2
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  provider: ^6.1.5

  fl_chart: ^0.68.0
  smooth_page_indicator: ^1.2.1
  animate_do: ^4.2.0
  flutter_riverpod: ^3.3.2

  top_snackbar_flutter: ^3.1.0
  share_plus: ^11.1.0
  equatable: ^2.0.7

  excel: ^4.0.6
  pdf: ^3.11.1
  path_provider: ^2.1.4
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

  socket_io_client: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/payment/
    - assets/images/onboarding/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"